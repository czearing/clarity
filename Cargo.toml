[package]
name = "clarity"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "A grammar and clarity engine that refuses what it cannot cite."
repository = "https://github.com/czearing/clarity"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
fitkit = { git = "https://github.com/czearing/fitkit" }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full", "extra-traits", "visit"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
fitkit-guards = { git = "https://github.com/czearing/fitkit" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

[[bench]]
name = "read"
harness = false

# A dynamic program is arithmetic in a loop, and unoptimised arithmetic in a loop is the whole of
# the running time. The tests read six hundred units of real prose, which takes half a minute
# optimised and the better part of an hour not.
[profile.test]
opt-level = 2

[profile.bench]
lto = true
codegen-units = 1
